<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>熊坑地图编辑器 | WJDR</title>
<meta name="description" content="规划阵型、换算坐标、一键出图。">
<meta property="og:title" content="熊坑地图编辑器 | WJDR">
<meta property="og:description" content="规划阵型、换算坐标、一键出图。">
<meta property="og:image" content="/map-og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="/map-og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff6332'/%3E%3Ctext x='16' y='23' font-size='17' text-anchor='middle' fill='%23fff'%3E%E2%97%88%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   重绘版 UI —— 独立原型，不依赖任何构建
   视觉方向：圆角卡片 + 浮动工具坞（游戏 HUD 式），与原版直角战术风区分
   ============================================================ */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface2:#f5f7fa;
  --board:#e8edf3; --line:#a8b4c0; --line-soft:#dde4ea;
  --ink:#152230; --muted:#46545f; --faint:#66737f;
  --accent:#c2410c; --accent-ink:#9d3609; --accent-soft:#fcebe1;
  --ok:#0f6b4a; --gold:#7a5a10; --danger:#a3271f;
  --ring1:#ff6b4a; --ring2:#f3b84b; --ring3:#70d6a3; --ring4:#64a8ff; --ring5:#a980ff;
  --grid-major:rgba(29,44,58,.5); --grid-minor:rgba(42,59,76,.2);
  --focus:#152230;
  --shadow:0 12px 32px rgba(20,35,55,.16);
  --shadow-sm:0 4px 14px rgba(20,35,55,.10);
  /* ---- 尺寸语言：容器 12 / 控件 9 / 标签 6（不再用 999px 药丸） ---- */
  --r-card:12px; --r-btn:9px; --r-tag:6px;
  --r-lg:12px; --r-md:10px; --r-sm:8px;
  /* 底部悬浮 HUD（工具坞+状态条）为 viewport 预留的高度（JS 随界面缩放同步） */
  --hud-h:76px;
  --ui-zoom:.9;   /* 默认「较小」档 */
}
[data-theme="dark"]{
  --bg:#05090f; --surface:#16222e; --surface2:#1b2836;
  --board:#0b1620; --line:#61798c; --line-soft:#33475a;
  --ink:#e9eff3; --muted:#aab8c4; --faint:#8b9aa8;
  --accent:#ff6332; --accent-ink:#ff8f66; --accent-soft:rgba(255,99,50,.14);
  --ok:#70d6a3; --gold:#f0c46d; --danger:#ff7e70;
  --grid-major:rgba(214,228,239,.42); --grid-minor:rgba(192,210,224,.28);
  --focus:#ffffff;
  --shadow:0 12px 32px rgba(0,0,0,.5);
  --shadow-sm:0 4px 14px rgba(0,0,0,.4);
}
[data-theme="contrast"]{
  --bg:#04070b; --surface:#1a2530; --surface2:#202e3c;
  --board:#13212d; --line:#8fa9bd; --line-soft:#43596b;
  --ink:#ffffff; --muted:#d3dde6; --faint:#b3c1cd;
  --accent:#ff7040; --accent-ink:#ffa27d; --accent-soft:rgba(255,112,64,.16);
  --ok:#86e6b8; --gold:#ffd98a; --danger:#ff9b90;
  --grid-major:rgba(224,236,245,.5); --grid-minor:rgba(206,222,234,.34);
  --focus:#ffffff;
  --shadow:0 12px 32px rgba(0,0,0,.6);
  --shadow-sm:0 4px 14px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:13px/1.55 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  /* 高度必须锁死：否则放大后的棋盘会把 body 撑高、滚动跑到页面上，
     viewport 自己永远不滚 —— 表现就是"按空格/拖空白都平移不了"。
     dvh：iOS/Android 浏览器地址栏收放时视口高度会变，dvh 实时跟随。 */
  height:100vh; height:100dvh; overflow:hidden;
  display:flex; flex-direction:column;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit; color:inherit; cursor:pointer}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ---------- 顶栏（极紧凑档：~36px，高度尽量让给棋盘） ---------- */
.topbar{
  display:flex; align-items:center; gap:12px;
  padding:4px 12px; padding-top:calc(4px + env(safe-area-inset-top));
  background:var(--surface);
  border-bottom:1px solid var(--line-soft);
}
.brand{display:flex; align-items:center; gap:8px; min-width:0}
.brand-mark{
  width:24px; height:24px; border-radius:8px; flex:none;
  display:grid; place-items:center; font-size:12px;
  background:linear-gradient(135deg,var(--accent),#e8734a); color:#fff;
}
.brand p{margin:0; font-size:10px; font-weight:700; letter-spacing:.14em; color:var(--faint); line-height:1.2}
.brand h1{margin:0; font-size:13px; font-weight:700; letter-spacing:.02em; white-space:nowrap; line-height:1.2}


.top-actions{margin-left:auto; display:flex; align-items:center; gap:5px}
.stat-pill{
  padding:3px 9px; border-radius:var(--r-tag); background:var(--surface2);
  color:var(--muted); font-size:11px; white-space:nowrap;
}
.icon-btn{
  width:28px; height:28px; border:1px solid var(--line-soft); border-radius:var(--r-btn);
  background:var(--surface); color:var(--muted); font-size:14px;
  display:grid; place-items:center; transition:background .15s,color .15s;
}
.icon-btn:hover:not(:disabled){background:var(--surface2); color:var(--ink)}
.icon-btn:disabled{opacity:.35; cursor:not-allowed}
.theme-seg{display:flex; gap:2px; background:var(--surface2); border-radius:var(--r-btn); padding:2px}
.theme-seg button{
  border:0; background:transparent; padding:4px 9px; border-radius:7px;
  font-size:11px; font-weight:600; color:var(--muted); line-height:1.4;
}
.theme-seg button.active{background:var(--accent-soft); color:var(--accent-ink)}

/* ---------- 主区 ---------- */
.stage-area{flex:1; position:relative; min-height:0; display:flex}
.viewport{
  flex:1; overflow:auto; display:flex;
  /* 上下左右留出坐标轴外伸（24px）+ 呼吸空间；底部给悬浮 HUD 预留 */
  padding:24px 20px calc(var(--hud-h) + env(safe-area-inset-bottom));
  scrollbar-width:thin; scrollbar-color:var(--line) transparent;
}
/* margin:auto 在内容溢出时自动退化为起点对齐、四周都可滚到 ——
   grid 的 place-items:center 做不到这一点（左/上溢出区域会滚不到） */
.viewport.pan{cursor:grab}
.viewport.pan:active{cursor:grabbing}
/* 宽度由 JS fitStage() 按「视口剩余空间」实测设定 —— 不再用 vh 猜 */
.stage{position:relative; width:min(84vh, 90%); aspect-ratio:1; flex:none; margin:auto}
.tilt-wrap{position:absolute; inset:0; transition:transform .28s ease; will-change:transform}
.stage.tilted .tilt-wrap{transform:rotate(-45deg) scale(.72)}
.board{
  position:absolute; inset:0; overflow:hidden; border-radius:var(--r-card);
  border:1.5px solid var(--line);
  background:
    linear-gradient(var(--grid-major) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),
    linear-gradient(var(--grid-minor) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-minor) 1px,transparent 1px),
    var(--board);
  background-size:20% 20%,20% 20%,4% 4%,4% 4%,100% 100%;
}
/* 游戏内视角：文字反向旋转保持水平 */
.stage.tilted .marker > small{transform:translate(-50%,-50%) rotate(45deg)}
.stage.tilted .marker .glyph,
.stage.tilted .marker .bear-in{transform:rotate(45deg)}
/* 坐标轴跟棋盘一起旋转，数字再反向转 45° 保持水平可读 */
.stage.tilted .axis span{transform:rotate(45deg)}

/* 坐标轴 */
.axis{position:absolute; display:grid; pointer-events:none; color:var(--faint); font-size:11px}
.axis span{display:grid; place-items:center}
.axis-x{left:20px; top:-22px; grid-template-columns:repeat(25,1fr); width:calc(100% - 20px); height:18px}
.axis-y{top:0; left:-24px; grid-template-rows:repeat(25,1fr); width:18px; height:100%}

/* 旗帜覆盖范围 */
.coverage{
  position:absolute; z-index:1; border-radius:var(--r-tag); pointer-events:none;
  border:1.5px dashed color-mix(in srgb,var(--ok) 55%,transparent);
  background:color-mix(in srgb,var(--ok) 10%,transparent);
}

/* 悬停落点预览 */
.hover-cell{
  position:absolute; z-index:2; border-radius:var(--r-tag); pointer-events:none;
  border:1.5px solid var(--focus); background:color-mix(in srgb,var(--focus) 12%,transparent);
}
.hover-cell.erase{border-color:var(--danger); background:color-mix(in srgb,var(--danger) 16%,transparent)}

/* 拖动落点框 */
.drop-preview{
  position:absolute; z-index:3; border-radius:var(--r-tag); pointer-events:none;
  border:1.5px solid var(--focus); background:color-mix(in srgb,var(--focus) 14%,transparent);
}

/* ---------- 棋子 ---------- */
.marker{
  position:absolute; z-index:4; display:grid; place-items:center;
  border-radius:var(--r-tag); border:1.5px solid var(--chip-line); background:var(--chip-bg);
  color:var(--chip-ink); cursor:grab; padding:0;
  touch-action:none; user-select:none; -webkit-user-select:none;
  transition:box-shadow .12s, transform .12s;
}
.marker:active{cursor:grabbing}
.marker.selected{z-index:6; box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}
.marker.dragging{z-index:7; border-style:dashed; border-color:var(--focus)}
.marker small{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  /* 字号跟棋盘实际宽度走（--bw 由 JS 同步）—— 固定 px 在高 DPI 缩放的
     屏幕上会超出格子，"显示不全"就是这么来的 */
  width:94%;
  font-size:clamp(7px, calc(var(--bw, 840px) * 0.0165), 14px);
  font-weight:700; color:var(--town-ink);
  text-shadow:0 0 3px rgba(255,255,255,.6), 0 0 1px rgba(255,255,255,.6);
  line-height:1.16; text-align:center;
  white-space:normal; word-break:break-all;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; pointer-events:none;
}
.marker-flag .glyph{font-size:clamp(8px, calc(var(--bw, 840px) * 0.03), 20px); line-height:1}
.marker-town{
  background:
    linear-gradient(90deg,transparent 49%,rgba(255,255,255,.3) 49% 51%,transparent 51%),
    linear-gradient(transparent 49%,rgba(255,255,255,.3) 49% 51%,transparent 51%),
    var(--town-color);
  border-color:color-mix(in srgb,var(--town-color) 68%,#101a24);
}
.marker-flag{border-color:var(--flag-line); background:var(--flag-bg); color:var(--flag-ink)}

.marker-mine{
  border-color:color-mix(in srgb,var(--gold) 62%,var(--line));
  background:color-mix(in srgb,var(--gold) 14%,var(--chip-bg)); color:var(--gold);
}
.marker-mine .glyph{font-size:clamp(9px, calc(var(--bw, 840px) * 0.032), 22px); line-height:1}
.marker-bear{
  border:2px solid var(--accent); background:var(--accent-soft); color:var(--accent-ink);
  cursor:default; border-radius:var(--r-sm);
}
.marker-bear .bear-in{display:flex; flex-direction:column; align-items:center; gap:2px}
.marker-bear .glyph{font-size:clamp(11px, calc(var(--bw, 840px) * 0.045), 26px); line-height:1}
.marker-bear small{position:static; transform:none; text-shadow:none; color:var(--accent-ink)}

/* 棋子色随主题 */
:root{--chip-bg:#ffffff; --chip-line:#8fa0b0; --chip-ink:#101a24; --town-ink:#101a24;
  --flag-bg:#ffffff; --flag-line:#0f6b4a; --flag-ink:#0f6b4a}
[data-theme="dark"]{--chip-bg:#13222d; --chip-line:#5b7488; --chip-ink:#fff;
  --town-ink:#101a24; --flag-bg:#10251f; --flag-line:#3e7662; --flag-ink:#70d6a3}
[data-theme="contrast"]{--chip-bg:#0d1720; --chip-line:#8fa9bd; --chip-ink:#fff;
  --town-ink:#101a24; --flag-bg:#0c2a22; --flag-line:#5b9c84; --flag-ink:#86e6b8}

/* ---------- 视图开关：常态住在底部 HUD 首行（永不遮挡棋盘）；
     宽屏展开右侧面板时搬进面板，改为 3 列网格 ---------- */
.view-float{display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap}
.float-row{display:flex; gap:2px}
.float-row button{
  border:0; background:transparent; padding:5px 9px; border-radius:var(--r-btn);
  font-size:11px; font-weight:600; color:var(--muted); white-space:nowrap;
}
.float-row button.on{background:var(--accent-soft); color:var(--accent-ink)}
/* HUD 首行：承载视图开关，与工具行之间用分隔线 */
.hud-views{padding:4px 6px; border-bottom:1px solid var(--line-soft)}
.float-row button:hover:not(.on){color:var(--ink)}
.zoom-btn{min-width:34px}
.zoom-label{min-width:52px; text-align:center; color:var(--ink)}

/* ---------- 右侧信息栏：宽扁窗口下把棋盘两侧的富余空间用起来 ----------
   窄窗口 / 手机自动隐藏（JS 按横向富余量决定），不挤占棋盘。 */
.side-info{
  display:none; width:240px; flex:none; overflow:auto;
  border-left:1px solid var(--line-soft); background:var(--surface);
  padding:16px 14px; scrollbar-width:thin;
}
.side-info.show{display:block}
.side-info section + section{margin-top:16px; padding-top:14px; border-top:1px solid var(--line-soft)}
.si-title{margin:0 0 9px; font-size:11px; font-weight:700; letter-spacing:.1em; color:var(--faint)}
/* 图例改为色块 + 文字：比一排彩色药丸安静得多 */
.si-legend{display:grid; grid-template-columns:1fr 1fr; gap:8px 10px}
.si-swatch{display:flex; align-items:center; gap:7px; font-size:11px; color:var(--muted)}
.si-swatch i{
  width:12px; height:12px; border-radius:3px; flex:none;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);
}
.si-stats{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.si-stats > div{
  display:flex; align-items:baseline; gap:7px;
  padding:8px 12px; border:1px solid var(--line-soft); border-radius:var(--r-sm);
  background:var(--surface2);
}
.si-stats b{font-size:15px; color:var(--ink)}
.si-stats span{font-size:11px; color:var(--muted)}
.si-keys{display:grid; grid-template-columns:1fr 1fr; gap:7px 10px}
.si-keys span{display:flex; align-items:center; gap:7px; font-size:11px; color:var(--muted)}
.si-keys kbd{
  min-width:20px; padding:2px 5px; border-radius:5px; text-align:center;
  border:1px solid var(--line-soft); color:var(--faint);
  font-family:inherit; font-size:10px;
}
/* 信息栏承载视图开关时：丢弃悬浮药丸样式，改为与面板一致的分段按钮 */
.side-info .view-float{flex-direction:column; align-items:stretch; gap:8px}
.side-info .float-row{
  display:grid; grid-template-columns:repeat(3, 1fr); gap:6px;
  background:none; border:0; padding:0; box-shadow:none;
}
.side-info .float-row button{
  border:1px solid var(--line-soft); border-radius:var(--r-btn);
  background:var(--surface); padding:8px 2px;
  font-size:12px; font-weight:600; text-align:center; white-space:nowrap;
}
.side-info .float-row button.on{
  background:var(--accent-soft); color:var(--accent-ink);
  border-color:color-mix(in srgb, var(--accent) 45%, transparent);
}
.side-info .float-row button:hover:not(.on){background:var(--surface2); color:var(--ink)}

/* ---------- 底部工具坞 ---------- */
.dock-wrap{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  display:flex; flex-direction:column; align-items:center;
  padding:0 10px calc(6px + env(safe-area-inset-bottom));
  pointer-events:none;
}
/* 工具坞与状态条同属一张卡：同宽、同圆角、同底色，不再叠两个宽度不等的药丸 */
.hud{
  pointer-events:auto; display:flex; flex-direction:column;
  max-width:calc(100vw - 16px);
  background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line-soft); border-radius:var(--r-card);
  box-shadow:var(--shadow); overflow:hidden;
}
.dock{
  display:flex; align-items:center; gap:2px;
  padding:5px; overflow-x:auto;
}
.dock .tool{
  display:flex; align-items:center; gap:5px;
  min-height:32px; padding:0 11px; border-radius:var(--r-btn); border:0;
  background:transparent; color:var(--muted); font-size:12px; font-weight:600;
  transition:background .15s,color .15s;
}
.dock .tool .sym{font-size:13px}
.dock .tool kbd{
  font-size:10px; padding:1px 5px; border-radius:var(--r-tag);
  border:1px solid var(--line-soft); color:var(--faint); font-family:inherit;
}
.dock .tool:hover:not(.active){background:var(--surface2); color:var(--ink)}
/* 全站唯一一种「选中」表达：浅橙底 + 橙字 + 橙描边 */
.dock .tool.active{
  background:var(--accent-soft); color:var(--accent-ink);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent);
}
.dock .sep{width:1px; height:20px; background:var(--line-soft); margin:0 3px}
.dock .icon-btn{border:0; background:transparent; width:30px; height:30px}
.dock .icon-btn:hover:not(:disabled){background:var(--surface2)}
/* 环色选择（选城镇时展开） */
.ring-picker{display:flex; gap:4px; margin-left:3px; padding-left:8px; border-left:1px solid var(--line-soft)}
.ring-picker button{
  width:26px; height:26px; border-radius:50%; border:2px solid transparent;
  background:var(--ring-color); color:#101a24; font-size:10px; font-weight:800;
}
.ring-picker button.active{border-color:var(--ink); box-shadow:0 0 0 2px var(--surface)}

/* 状态条 */
.statusbar{
  display:flex; align-items:center; justify-content:center; gap:12px;
  padding:6px 12px; border-top:1px solid var(--line-soft);
  font-size:11px; color:var(--faint); overflow:hidden;
}
.statusbar .coord{color:var(--ink); font-weight:600; white-space:nowrap}
.statusbar > *{line-height:1.3}
.origin-pill{
  border:1px solid var(--line-soft); background:var(--surface2); color:var(--muted);
  border-radius:var(--r-tag); padding:2px 8px; font-size:11px; font-weight:600;
  line-height:1.3; white-space:nowrap;
}
.origin-pill:hover{color:var(--accent-ink); border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.statusbar .hint{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.statusbar .tool-now{display:flex; align-items:center; gap:6px; white-space:nowrap}
.statusbar .tool-now strong{color:var(--accent-ink)}

/* ---------- 就地属性卡片 ---------- */
.prop-card{
  position:absolute; z-index:40; width:230px;
  background:var(--surface); border:1px solid var(--line-soft);
  border-radius:var(--r-card); box-shadow:var(--shadow);
  padding:14px; animation:pop .16s ease;
}
@keyframes pop{from{opacity:0; transform:scale(.96)}to{opacity:1; transform:scale(1)}}
.prop-card h3{margin:0 0 2px; font-size:15px; display:flex; align-items:center; gap:7px}
.prop-card .sub{margin:0 0 10px; font-size:11px; color:var(--faint)}
.prop-card label{display:block; font-size:11px; color:var(--faint); margin:9px 0 4px}
.prop-card input[type=text],.prop-card input[type=number]{
  width:100%; padding:7px 10px; border:1px solid var(--line-soft); border-radius:var(--r-sm);
  background:var(--surface2); color:var(--ink); font:inherit; font-size:13px;
}
.prop-card input:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent); border-color:transparent}
.prop-card .rings{display:flex; gap:6px}
.prop-card .rings button{
  flex:1; height:30px; border-radius:var(--r-sm); border:2px solid transparent;
  background:var(--ring-color); color:#101a24; font-size:12px; font-weight:800;
}
.prop-card .rings button.active{border-color:var(--ink)}
.prop-card .xy{display:flex; gap:8px}
.prop-card .xy label{flex:1}
.prop-card .del{
  width:100%; margin-top:12px; padding:8px; border-radius:var(--r-sm);
  border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);
  background:color-mix(in srgb,var(--danger) 8%,transparent); color:var(--danger);
  font-size:13px; font-weight:600;
}
.prop-card .del:hover{background:color-mix(in srgb,var(--danger) 16%,transparent)}
.prop-card .fixed{
  padding:12px; border-radius:var(--r-sm); text-align:center; font-size:12px; color:var(--faint);
  background:var(--accent-soft); color:var(--accent-ink);
}

/* Toast */
.toast{
  position:fixed; left:50%; top:50px; transform:translateX(-50%);
  z-index:60; background:var(--ink); color:var(--bg);
  padding:9px 16px; border-radius:var(--r-btn); font-size:13px; font-weight:600;
  opacity:0; pointer-events:none; transition:opacity .2s;
}
.toast.show{opacity:1}

/* ---------- 菜单与模态 ---------- */
.menu{
  position:fixed; top:42px; right:12px; z-index:50; width:224px;
  display:flex; flex-direction:column; padding:6px;
  background:var(--surface); border:1px solid var(--line-soft);
  border-radius:var(--r-card); box-shadow:var(--shadow);
}
.menu button{
  text-align:left; border:0; background:transparent;
  padding:9px 11px; border-radius:var(--r-btn);
  font-size:13px; font-weight:500; color:var(--ink);
}
.menu button:hover{background:var(--surface2)}
.menu button.danger{color:var(--danger)}
.menu-sep{height:1px; background:var(--line-soft); margin:5px 4px}
.menu .tpl-row{display:flex; gap:4px; align-items:stretch; padding:0 2px}
.menu .tpl-row button{flex:1; min-width:0}
.menu .tpl-row button:first-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.menu-label{margin:2px 8px 4px; font-size:11px; font-weight:700; letter-spacing:.1em; color:var(--faint)}
.ui-zoom-row{display:flex; gap:4px; padding:0 2px 2px}
.ui-zoom-row button{flex:1; text-align:center; padding:7px 4px; font-size:12px; border:1px solid var(--line-soft); border-radius:var(--r-btn)}
.ui-zoom-row button.active{
  border-color:color-mix(in srgb,var(--accent) 45%,transparent);
  color:var(--accent-ink); background:var(--accent-soft); font-weight:700;
}
/* 界面缩放只作用于桌面（指针设备）：手机上按钮必须保住 40px 触控底线 */
@media (min-width:861px){
  .topbar,.dock-wrap > *{zoom:var(--ui-zoom, .9)}
}
@media (max-width:860px){
  .ui-zoom-block{display:none}
}
.menu .tpl-row .del{width:32px; flex:none; text-align:center; color:var(--faint); font-size:15px}
.menu .tpl-row .del:hover{color:var(--danger)}
.menu .menu-label{padding:6px 11px 2px; font-size:11px; color:var(--faint); font-weight:700}

.modal-backdrop{
  position:fixed; inset:0; z-index:70; display:grid; place-items:center;
  padding:20px; background:rgba(8,16,25,.48);
}
.modal{
  width:min(540px,100%); max-height:82vh; overflow:auto;
  background:var(--surface); border-radius:var(--r-lg);
  border:1px solid var(--line-soft); box-shadow:var(--shadow); padding:16px 18px;
}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
.modal-head h3{margin:0; font-size:15px}
.modal textarea{
  width:100%; height:190px; resize:vertical;
  border:1px solid var(--line-soft); border-radius:var(--r-sm);
  background:var(--surface2); color:var(--ink);
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  padding:10px;
}
.modal textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent); border-color:transparent}
.m-actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
.m-actions button{
  flex:1; min-width:130px; padding:9px 12px; border-radius:var(--r-sm);
  border:1px solid var(--line); background:var(--surface); font-size:13px; font-weight:600;
}
.m-actions button:hover{background:var(--surface2)}
.m-actions button.primary{border-color:var(--accent); background:var(--accent); color:#fff}
.m-actions button.primary:hover{filter:brightness(1.08)}
.m-note{margin:10px 0 0; font-size:11px; color:var(--gold); line-height:1.5}
.m-xy{display:flex; gap:10px}
.m-xy label{flex:1; font-size:11px; color:var(--faint); display:block}
.m-xy input{
  width:100%; margin-top:4px; padding:8px 10px;
  border:1px solid var(--line-soft); border-radius:var(--r-sm);
  background:var(--surface2); color:var(--ink); font:inherit;
}
.m-preview{margin:10px 0 0; padding:9px 11px; border-radius:var(--r-sm);
  background:var(--surface2); font:11px/1.6 ui-monospace,Menlo,Consolas,monospace;
  color:var(--muted); max-height:120px; overflow:auto; white-space:pre}
.toast.show{opacity:1}

/* 响应式 */
@media (max-width:860px){
  .brand p{display:none}
  .brand-mark{width:22px; height:22px; font-size:11px}
  .brand h1{font-size:13px}
  .topbar{padding:4px 10px; padding-top:calc(4px + env(safe-area-inset-top)); gap:8px}
  .stat-pill{display:none}
  /* 触控底线：手机上工具按钮保持 40px（Apple 44 / Android 48 折中） */
  .dock{padding:4px}
  .dock .tool{min-height:40px; padding:0 11px}
  .statusbar{padding:3px 10px; gap:9px}
  .hud-views{padding:3px 5px}
  .float-row button{padding:4px 8px}
  .dock .tool .sym{font-size:16px}
  .dock .tool span.lbl{display:none}
  .dock .tool kbd{display:none}
  .ring-picker{padding-left:7px; margin-left:2px}
  .ring-picker button{width:30px; height:30px; font-size:11px}
  .view-float{top:8px; right:8px}
  .statusbar .hint{display:none}
  .viewport{padding:20px 16px calc(var(--hud-h) + 8px + env(safe-area-inset-bottom))}
}
@media (max-width:520px){
  .theme-seg{display:none}
  .topbar{gap:6px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">◈</span>
    <div>
      <p>WJDR 联盟工具</p>
      <h1>熊坑地图编辑器</h1>
    </div>
  </div>
  <div class="top-actions">
    <span class="stat-pill" id="statCount">—</span>
    <button class="icon-btn" id="btnUndo" title="撤销（Ctrl+Z）" disabled>↶</button>
    <button class="icon-btn" id="btnRedo" title="重做（Ctrl+Shift+Z）" disabled>↷</button>
    <div class="theme-seg" role="group" aria-label="配色主题">
      <button data-theme-set="light" class="active">浅色</button>
      <button data-theme-set="dark">深色</button>
      <button data-theme-set="contrast">高对比</button>
    </div>
    <button class="icon-btn" id="btnMore" title="数据与模板" aria-haspopup="menu">⋯</button>
  </div>
</header>

<main class="stage-area">
  <div class="viewport" id="viewport">
    <div class="stage" id="stage">
      <div class="tilt-wrap" id="tiltWrap">
        <div class="axis axis-x" id="axisX" aria-hidden="true"></div>
        <div class="axis axis-y" id="axisY" aria-hidden="true"></div>
        <div class="board" id="board"></div>
      </div>

    </div>
  </div>

  <aside class="side-info" id="sideInfo" aria-label="图例与统计">
    <section id="siControls"></section>
    <section>
      <p class="si-title">图例</p>
      <div class="si-legend">
        <span class="si-swatch"><i style="background:var(--ring1)"></i>1 环</span>
        <span class="si-swatch"><i style="background:var(--ring2)"></i>2 环</span>
        <span class="si-swatch"><i style="background:var(--ring3)"></i>3 环</span>
        <span class="si-swatch"><i style="background:var(--ring4)"></i>4 环</span>
        <span class="si-swatch"><i style="background:var(--ring5)"></i>5 环</span>
        <span class="si-swatch"><i style="background:var(--ok)"></i>旗帜</span>
        <span class="si-swatch"><i style="background:var(--gold)"></i>联盟矿</span>
        <span class="si-swatch"><i style="background:var(--accent)"></i>熊坑</span>
      </div>
    </section>
    <section>
      <p class="si-title">统计</p>
      <div class="si-stats" id="siStats"></div>
    </section>
    <section>
      <p class="si-title">快捷键</p>
      <div class="si-keys">
        <span><kbd>V</kbd>选择</span>
        <span><kbd>T</kbd>城镇</span>
        <span><kbd>F</kbd>旗帜</span>
        <span><kbd>M</kbd>联盟矿</span>
        <span><kbd>E</kbd>擦除</span>
        <span><kbd>1-5</kbd>换环色</span>
        <span><kbd>Esc</kbd>回选择</span>
        <span><kbd>Del</kbd>删除选中</span>
        <span><kbd>Ctrl Z</kbd>撤销</span>
        <span><kbd>Ctrl 滚轮</kbd>缩放</span>
        <span><kbd>空格</kbd>拖动平移</span>
        <span><kbd>右键</kbd>就地编辑</span>
      </div>
    </section>
  </aside>

  <div class="prop-card" id="propCard" hidden></div>
</main>

<div class="dock-wrap">
  <div class="hud">
  <div class="hud-views" id="hudViews">
    <div class="view-float">
      <div class="float-row">
        <button id="tgTowns" class="on">城镇</button>
        <button id="tgCoverage" class="on">覆盖范围</button>
        <button id="tgTilt">游戏内视角</button>
      </div>
      <div class="float-row">
        <button class="zoom-btn" id="zoomOut" title="缩小（Ctrl+滚轮）">−</button>
        <button class="zoom-label" id="zoomReset" title="重置缩放">100%</button>
        <button class="zoom-btn" id="zoomIn" title="放大（Ctrl+滚轮）">+</button>
      </div>
    </div>
  </div>
  <div class="dock" role="toolbar" aria-label="地图工具">
    <button class="tool active" data-tool="select"><span class="sym">↖</span><span class="lbl">选择</span><kbd>V</kbd></button>
    <button class="tool" data-tool="town"><span class="sym">▦</span><span class="lbl">城镇</span><kbd>T</kbd></button>
    <button class="tool" data-tool="flag"><span class="sym">⚑</span><span class="lbl">旗帜</span><kbd>F</kbd></button>
    <button class="tool" data-tool="mine"><span class="sym">⛏</span><span class="lbl">联盟矿</span><kbd>M</kbd></button>
    <button class="tool" data-tool="erase"><span class="sym">×</span><span class="lbl">擦除</span><kbd>E</kbd></button>
    <div class="sep"></div>
    <div class="ring-picker" id="ringPicker" hidden></div>
  </div>
  <div class="statusbar">
    <span class="coord" id="sbCoord">世界 —</span>
    <button class="origin-pill" id="sbOrigin" title="点击设置熊坑的世界坐标（原点）">原点 512 , 512</button>
    <span class="hint">拖动空白平移（或按住空格）· Ctrl + 滚轮缩放 · 连续放置不回退</span>
    <span class="tool-now">当前工具 <strong id="sbTool">选择</strong></span>
  </div>
  </div>
</div>

<input type="file" id="imgFile" accept=".png,image/png" hidden>

<div class="menu" id="moreMenu" hidden role="menu">

  <div class="menu-sep"></div>
  <button data-act="save-tpl">保存当前为模板</button>
  <button data-act="tpl-square">载入方形模板</button>
  <button data-act="tpl-cross">载入十字模板</button>
  <div id="userTpls"></div>
  <div class="menu-sep"></div>
  <button data-act="coords">熊坑原点 / 坐标换算</button>

  <div class="menu-sep"></div>
  <p class="menu-label">配色主题</p>

  </div>
</div>

let markers = [], nextId = 1;

/* ---------- 默认布局：程序化生成（熊坑 + 五环城镇 + 旗帜 + 矿） ---------- */
function overlaps(a, b){
  const fa = FOOT[a.type], fb = FOOT[b.type];
  return a.x < b.x + fb.w && b.x < a.x + fa.w && a.y < b.y + fb.h && b.y < a.y + fa.h;
}
function fits(m){
  if (m.x < 0 || m.y < 0 || m.x + FOOT[m.type].w > GRID || m.y + FOOT[m.type].h > GRID) return false;
  return !markers.some(o => overlaps(m, o));
}
function genInitial(){
  markers = [];
  nextId = 1;
  const add = (m) => { if (fits(m)) markers.push({ id:'m'+(nextId++), ...m }); };
  add({ type:'bear', x:11, y:11, name:'熊坑' });
  const rings = [
    { ring:1, r:4.2,  n:8  }, { ring:2, r:6.6,  n:12 },
    { ring:3, r:9,    n:14 }, { ring:4, r:11.2, n:16 },
    { ring:5, r:13.2, n:18 },
  ];
  let tn = 1;
  for (const R of rings){
    for (let i = 0; i < R.n; i++){
      const a = (i / R.n) * Math.PI * 2 + R.ring * 0.55;
      add({ type:'town', ring:R.ring,
        x:Math.round(12 + Math.cos(a)*R.r) - 1, y:Math.round(12 + Math.sin(a)*R.r) - 1,
        name:'城镇 ' + String(tn++).padStart(2,'0') });
    }
  }
  let fn = 1;
  for (const R of rings){
    for (let i = 0; i < Math.ceil(R.n/2); i++){
      const a = ((i + 0.5) / Math.ceil(R.n/2)) * Math.PI * 2 + R.ring * 0.55 + 0.42;
      add({ type:'flag', x:Math.round(12 + Math.cos(a)*(R.r+2.5)), y:Math.round(12 + Math.sin(a)*(R.r+2.5)),
        name:'旗帜 ' + String(fn++).padStart(2,'0') });
    }
  }
  [[0,0],[22,0],[0,22],[22,22],[11,0],[0,11]].forEach(([x,y],i) =>
    add({ type:'mine', x, y, name:'联盟矿 ' + String(i+1).padStart(2,'0') }));
}

/* ---------- 持久化 ---------- */
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({markers, nextId})); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!Array.isArray(d.markers) || !d.markers.length) return false;
    markers = d.markers; nextId = d.nextId || markers.length + 1;
    return true;
  }catch(e){ return false; }
}

/* ---------- 工具函数 ---------- */
function clamp(v, max = GRID - 1){ return Math.max(0, Math.min(max, Math.round(v))); }
function snap(type, x, y){
  const f = FOOT[type];
  return { x:clamp(x, GRID - f.w), y:clamp(y, GRID - f.h) };
}
function centeredAt(type, px, py){
  const f = FOOT[type];
  const sx = f.w % 2 === 0 ? Math.round(px) - f.w/2 : Math.floor(px) - Math.floor(f.w/2);
  const sy = f.h % 2 === 0 ? Math.round(py) - f.h/2 : Math.floor(py) - Math.floor(f.h/2);
  return snap(type, sx, sy);
}
function nextName(type){
  const n = markers.filter(m => m.type === type).length + 1;
  return TYPE_LABEL[type] + ' ' + String(n).padStart(2,'0');
}
function boardPoint(cx, cy){
  const r = board.getBoundingClientRect();
  if (tilted){
    const dx = cx - (r.left + r.width/2), dy = cy - (r.top + r.height/2);
    const a = 45 * Math.PI / 180;
    const rx = dx * Math.cos(a) - dy * Math.sin(a);
    const ry = dx * Math.sin(a) + dy * Math.cos(a);
    return { x:(rx / TILT + r.width/2) / r.width * GRID,
             y:(ry / TILT + r.height/2) / r.height * GRID };
  }
  return { x:(cx - r.left) / r.width * GRID, y:(cy - r.top) / r.height * GRID };
}

/* ---------- 历史 ---------- */
function commit(next){
  history.push(JSON.stringify(markers));
  if (history.length > 50) history.shift();
  future = [];
  markers = next;
  save(); renderAll();
}
function undo(){
  if (!history.length) return;
  future.unshift(JSON.stringify(markers));
  markers = JSON.parse(history.pop());
  selectedId = null; save(); renderAll();
}
function redo(){
  if (!future.length) return;
  history.push(JSON.stringify(markers));
  markers = JSON.parse(future.shift());
  selectedId = null; save(); renderAll();
}

/* ---------- Toast ---------- */
let toastTimer = null;
function notify(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ================= 渲染 ================= */
/* 把棋盘实际宽度写进 --bw，棋子文字/图标按比例缩放 ——
   高 DPI 缩放屏（125%/150%）上格子变小，固定 px 字号必然撑爆格子 */
function syncBoardFont(){
  const w = board.clientWidth || 840;
  document.documentElement.style.setProperty('--bw', Math.round(w) + 'px');
}
function renderAxes(){
  /* 轴不再显示 1-25 的格子序号，而是世界坐标：
     以熊坑中心为原点（worldX/Y），相对格距 × 2 —— 与「城镇坐标换算」同一套公式。
     刻度取 2/7/12/17/22，保证熊坑原点值一定出现在轴上。 */
  const marks = [2, 7, 12, 17, 22];
  let hx = '', hy = '';
  for (let i = 0; i < GRID; i++){
    const show = marks.indexOf(i) >= 0;
    hx += '<span>' + (show ? Math.round(worldX + (i - 12) * 2) : '') + '</span>';
    hy += '<span>' + (show ? Math.round(worldY + (i - 12) * 2) : '') + '</span>';
  }
  $('axisX').innerHTML = hx; $('axisY').innerHTML = hy;
}

function markerEl(m){
  const f = FOOT[m.type];
  const el = document.createElement('button');
  el.type = 'button';
  el.className = 'marker marker-' + m.type + (selectedId === m.id ? ' selected' : '');
  el.style.left = (m.x / GRID * 100) + '%';
  el.style.top = (m.y / GRID * 100) + '%';
  el.style.width = (f.w / GRID * 100) + '%';
  el.style.height = (f.h / GRID * 100) + '%';
  el.style.touchAction = 'none';
  if (m.type === 'town') el.style.setProperty('--town-color', RING_COLOR[m.ring || 1]);
  if (m.type === 'bear'){
    el.innerHTML = '<span class="bear-in"><span class="glyph">◎</span><small>' + m.name + '</small></span>';
  } else if (m.type === 'flag'){
    el.innerHTML = '<span class="glyph">⚑</span>';
  } else if (m.type === 'mine'){
    el.innerHTML = '<span class="glyph">⛏</span>';
  } else {
    el.innerHTML = '<small>' + m.name + '</small>';
  }
  el.setAttribute('aria-label', m.name + '，第 ' + (m.x+1) + ' 列第 ' + (m.y+1) + ' 行');
  /* 事件 */
  el.addEventListener('pointerdown', e => beginDrag(e, m.id));
  el.addEventListener('contextmenu', e => {
    e.preventDefault(); e.stopPropagation();
    selectMarker(m.id); openPropCard();
  });
  el.addEventListener('click', e => {
    e.stopPropagation();
    if (justDragged()) return;
    if (tool === 'erase'){
      if (m.type === 'bear'){ notify('熊坑固定在地图中心，无法删除'); return; }
      commit(markers.filter(o => o.id !== m.id));
      if (selectedId === m.id){ selectedId = null; closePropCard(); }
      return;
    }
    selectMarker(m.id); openPropCard();
  });
  return el;
}

let lastDragEnd = -1e9, dragActive = false;
/* 拖动结束后 150ms 内的 click 一律忽略 —— 不能依赖浏览器是否派发
   拖动后的 click（不同引擎行为不一致），时间窗是无副作用的兜底 */
function justDragged(){ return performance.now() - lastDragEnd < 150; }
/* 右侧信息栏的统计数字 */
function renderSideInfo(){
  if (!sideInfo) return;
  const c = { town:0, flag:0, mine:0, bear:0 };
  for (const m of markers) c[m.type] = (c[m.type] || 0) + 1;
  $('siStats').innerHTML =
    '<div><b>' + (c.town || 0) + '</b><span>城镇</span></div>' +
    '<div><b>' + (c.flag || 0) + '</b><span>旗帜</span></div>' +
    '<div><b>' + (c.mine || 0) + '</b><span>联盟矿</span></div>' +
    '<div><b>' + (c.bear || 0) + '</b><span>熊坑</span></div>';
}

function renderAll(){
  syncBoardFont();
  renderSideInfo();
  board.innerHTML = '';
  /* 覆盖范围 */
  if (showCoverage || (dragState && markers.find(m => m.id === dragState.id && m.type === 'flag'))){
    for (const m of markers){
      if (m.type !== 'flag') continue;
      if (!showCoverage && (!dragState || m.id !== dragState.id)) continue;
      const c = document.createElement('span');
      c.className = 'coverage';
      c.style.left = ((m.x - FLAG_RANGE) / GRID * 100) + '%';
      c.style.top = ((m.y - FLAG_RANGE) / GRID * 100) + '%';
      c.style.width = ((FLAG_RANGE*2+1) / GRID * 100) + '%';
      c.style.height = ((FLAG_RANGE*2+1) / GRID * 100) + '%';
      board.appendChild(c);
    }
  }
  /* 悬停预览 */
  if (hoverCell && tool !== 'select'){
    const p = tool === 'erase'
      ? { x:hoverCell.x, y:hoverCell.y, w:1, h:1 }
      : (() => { const t = centeredAt(tool, hoverCell.x + .5, hoverCell.y + .5);
                 return { x:t.x, y:t.y, w:FOOT[tool].w, h:FOOT[tool].h }; })();
    const h = document.createElement('span');
    h.className = 'hover-cell' + (tool === 'erase' ? ' erase' : '');
    h.style.left = (p.x / GRID * 100) + '%'; h.style.top = (p.y / GRID * 100) + '%';
    h.style.width = (p.w / GRID * 100) + '%'; h.style.height = (p.h / GRID * 100) + '%';
    board.appendChild(h);
  }
  /* 拖动落点框 */
  if (dragPreview && dragState){
    const src = markers.find(m => m.id === dragState.id);
    if (src){
      const d = document.createElement('span');
      d.className = 'drop-preview';
      d.style.left = (dragPreview.x / GRID * 100) + '%';
      d.style.top = (dragPreview.y / GRID * 100) + '%';
      d.style.width = (FOOT[src.type].w / GRID * 100) + '%';
      d.style.height = (FOOT[src.type].h / GRID * 100) + '%';
      board.appendChild(d);
    }
  }
  /* 棋子 */
  if (showTowns || true){
    for (const m of markers){
      if (m.type === 'town' && !showTowns) continue;
      board.appendChild(markerEl(m));
    }
  }
  /* 统计与按钮态 */
  const towns = markers.filter(m => m.type === 'town').length;
  const flags = markers.filter(m => m.type === 'flag').length;
  $('statCount').textContent = '城镇 ' + towns + ' · 旗帜 ' + flags + ' · 共 ' + markers.length;
  $('btnUndo').disabled = !history.length;
  $('btnRedo').disabled = !future.length;
  positionPropCard();
}

/* ================= 交互 ================= */
/* 棋盘：悬停 / 点击放置 / 右键 */
board.addEventListener('pointermove', e => {
  if (dragState) return;
  const p = boardPoint(e.clientX, e.clientY);
  const cell = { x:clamp(Math.floor(p.x)), y:clamp(Math.floor(p.y)) };
  if (!hoverCell || hoverCell.x !== cell.x || hoverCell.y !== cell.y){
    hoverCell = cell;
    $('sbCoord').textContent = '世界 ' + Math.round(worldX + (cell.x - 12) * 2) +
      ' , ' + Math.round(worldY + (cell.y - 12) * 2);
    if (tool !== 'select') renderAll();
  }
});
board.addEventListener('pointerleave', () => {
  hoverCell = null; $('sbCoord').textContent = '世界 —';
  if (tool !== 'select') renderAll();
});
board.addEventListener('click', e => {
  if (e.target !== board) return;
  if (justDragged() || justPanned()) return;
  closePropCard();
  if (tool === 'select' || tool === 'erase') return;
  const p = boardPoint(e.clientX, e.clientY);
  const cell = { x:clamp(Math.floor(p.x)), y:clamp(Math.floor(p.y)) };
  const pos = centeredAt(tool, p.x, p.y);
  const m = { id:'m'+(nextId++), type:tool, ...pos };
  if (tool === 'town') m.ring = activeRing;
  m.name = nextName(tool);
  if (!fits(m)){ nextId--; notify('目标占地与其他对象重叠'); return; }
  commit([...markers, m]);
});
board.addEventListener('contextmenu', e => e.preventDefault());

/* 拖动棋子（Pointer Events，拖动中直接操作 DOM，不重建，保证 60fps） */
let dragEl = null, previewEl = null;
function beginDrag(e, id){
  if (spaceDown) return;
  const m = markers.find(o => o.id === id);
  if (!m || m.type === 'bear') return;
  if (tool !== 'select'){
    /* 只记状态不重建 DOM —— 重建会把紧随的 click 弄丢（擦除靠它） */
    selectedId = id; openPropCard(); return;
  }
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  dragActive = false;
  dragState = { id, pointerId:e.pointerId, sx:e.clientX, sy:e.clientY };
  dragEl = e.currentTarget;
  try{ dragEl.setPointerCapture(e.pointerId); }catch(err){}
}
board.addEventListener('pointermove', e => {
  if (dragState && e.pointerId === dragState.pointerId){
    const m = markers.find(o => o.id === dragState.id);
    if (!m || !dragEl) return;
    if (!dragActive){
      if (Math.hypot(e.clientX - dragState.sx, e.clientY - dragState.sy) < 4) return;
      dragActive = true;
      dragEl.classList.add('dragging');
      const f = FOOT[m.type];
      previewEl = document.createElement('span');
      previewEl.className = 'drop-preview';
      previewEl.style.width = (f.w / GRID * 100) + '%';
      previewEl.style.height = (f.h / GRID * 100) + '%';
      board.appendChild(previewEl);
    }
    const p = boardPoint(e.clientX, e.clientY);
    const pos = centeredAt(m.type, p.x, p.y);
    dragPreview = pos;
    dragEl.style.left = (pos.x / GRID * 100) + '%';
    dragEl.style.top = (pos.y / GRID * 100) + '%';
    previewEl.style.left = (pos.x / GRID * 100) + '%';
    previewEl.style.top = (pos.y / GRID * 100) + '%';
    $('sbCoord').textContent = '第 ' + (pos.x+1) + ' 列 · 第 ' + (pos.y+1) + ' 行';
    return;
  }
  if (dragState) return;
  /* 悬停落点预览 */
  const p = boardPoint(e.clientX, e.clientY);
  const cell = { x:clamp(Math.floor(p.x)), y:clamp(Math.floor(p.y)) };
  if (!hoverCell || hoverCell.x !== cell.x || hoverCell.y !== cell.y){
    hoverCell = cell;
    $('sbCoord').textContent = '第 ' + (cell.x+1) + ' 列 · 第 ' + (cell.y+1) + ' 行';
    if (tool !== 'select') renderAll();
  }
});
board.addEventListener('pointerup', e => {
  if (!dragState || e.pointerId !== dragState.pointerId) return;
  const id = dragState.id;
  const preview = dragPreview;
  const wasMoved = dragActive;
  dragState = null; dragPreview = null; dragActive = false;
  if (previewEl){ previewEl.remove(); previewEl = null; }
  if (!wasMoved){
    /* 不重建 DOM —— 浏览器马上要补发 click（选中靠它） */
    if (dragEl) dragEl.classList.remove('dragging');
    dragEl = null;
    return;
  }
  dragEl = null;
  lastDragEnd = performance.now();
  const m = markers.find(o => o.id === id);
  if (!m || !preview){ renderAll(); return; }
  const cand = { ...m, ...preview };
  if (markers.some(o => o.id !== id && overlaps(cand, o))){
    notify('目标占地与其他对象重叠');
    renderAll();
    return;
  }
  commit(markers.map(o => o.id === id ? { ...o, ...preview } : o));
});
board.addEventListener('pointercancel', () => {
  dragState = null; dragPreview = null; dragEl = null; dragActive = false;
  if (previewEl){ previewEl.remove(); previewEl = null; }
  renderAll();
});

/* ---------- 选中与就地属性卡 ---------- */
function selectMarker(id){ selectedId = id; renderAll(); }
function openPropCard(){
  const m = markers.find(o => o.id === selectedId);
  if (!m){ closePropCard(); return; }
  let html = '';
  if (m.type === 'bear'){
    html = '<h3>◎ 熊坑</h3><p class="sub">固定在 25×25 地图中心</p>' +
           '<div class="fixed">熊坑不可移动、不可删除。<br>所有城镇坐标以它为原点换算。</div>';
  } else {
    const wx = worldX + Math.round((m.x + FOOT[m.type].w / 2 - 12.5) * 2);
    const wy = worldY + Math.round((m.y + FOOT[m.type].h / 2 - 12.5) * 2);
    html = '<h3>' + (m.type === 'town' ? '▦' : m.type === 'flag' ? '⚑' : '⛏') + ' ' + TYPE_LABEL[m.type] + '</h3>' +
           '<p class="sub">第 ' + (m.x+1) + ' 列 · 第 ' + (m.y+1) + ' 行 · 世界 ' + wx + ',' + wy +
           ' · 占地 ' + FOOT[m.type].w + '×' + FOOT[m.type].h +
           (m.type === 'flag' ? ' · 覆盖 7×7' : '') + '</p>';
    if (m.type === 'town'){
      html += '<label>名称</label><input type="text" id="pcName" maxlength="18" value="' + m.name.replace(/"/g,'&quot;') + '">' +
              '<label>所属环线</label><div class="rings">' +
              [1,2,3,4,5].map(r => '<button data-ring="' + r + '" class="' + (m.ring === r ? 'active' : '') + '" style="--ring-color:' + RING_COLOR[r] + '">' + r + '</button>').join('') + '</div>';
    }
    html += '<div class="xy"><div><label>列 X</label><input type="number" id="pcX" min="1" max="' + (GRID - FOOT[m.type].w + 1) + '" value="' + (m.x+1) + '"></div>' +
            '<div><label>行 Y</label><input type="number" id="pcY" min="1" max="' + (GRID - FOOT[m.type].h + 1) + '" value="' + (m.y+1) + '"></div></div>' +
            '<button class="del" id="pcDel">删除这个对象</button>';
  }
  propCard.innerHTML = html;
  propCard.hidden = false;
  positionPropCard();
  /* 卡片事件 */
  const nameInput = $('pcName');
  if (nameInput) nameInput.addEventListener('input', e => {
    const mm = markers.find(o => o.id === selectedId);
    if (mm){ mm.name = e.target.value || mm.name; save();
      const el = board.querySelector('.marker.selected small');
      if (el) el.textContent = mm.name; }
  });
  propCard.querySelectorAll('[data-ring]').forEach(b => b.addEventListener('click', () => {
    commit(markers.map(o => o.id === selectedId ? { ...o, ring:Number(b.dataset.ring) } : o));
    openPropCard();
  }));
  const xi = $('pcX'), yi = $('pcY');
  if (xi) xi.addEventListener('change', () => applyXY(Number(xi.value) - 1, m.y));
  if (yi) yi.addEventListener('change', () => applyXY(m.x, Number(yi.value) - 1));
  const del = $('pcDel');
  if (del) del.addEventListener('click', () => {
    commit(markers.filter(o => o.id !== selectedId));
    selectedId = null; closePropCard();
  });
}
function applyXY(x, y){
  const m = markers.find(o => o.id === selectedId);
  if (!m) return;
  const pos = snap(m.type, x, y);
  const cand = { ...m, ...pos };
  if (markers.some(o => o.id !== m.id && overlaps(cand, o))){ notify('目标占地与其他对象重叠'); openPropCard(); return; }
  commit(markers.map(o => o.id === m.id ? { ...o, ...pos } : o));
  openPropCard();
}
function closePropCard(){ propCard.hidden = true; }
function positionPropCard(){
  if (propCard.hidden) return;
  const m = markers.find(o => o.id === selectedId);
  if (!m){ closePropCard(); return; }
  const area = stage.parentElement.getBoundingClientRect();
  const st = stage.getBoundingClientRect();
  const f = FOOT[m.type];
  /* 对象中心的屏幕坐标（含倾斜） */
  const nx = (m.x + f.w/2) / GRID - .5, ny = (m.y + f.h/2) / GRID - .5;
  let sx = st.left + st.width/2, sy = st.top + st.height/2;
  if (tilted){
    const a = -45 * Math.PI / 180;
    sx += (nx * st.width) * Math.cos(a) * TILT - (ny * st.height) * Math.sin(a) * TILT;
    sy += (nx * st.width) * Math.sin(a) * TILT + (ny * st.height) * Math.cos(a) * TILT;
  } else {
    sx += nx * st.width; sy += ny * st.height;
  }
  const W = 230, M = 10;
  let left = sx + 18;
  if (left + W > area.right - M) left = sx - 18 - W;
  left = Math.max(area.left + M, Math.min(left, area.right - W - M));
  const top = Math.max(area.top + M, Math.min(sy - 30, area.bottom - 260));
  propCard.style.left = (left - area.left) + 'px';
  propCard.style.top = (top - area.top) + 'px';
}
document.addEventListener('pointerdown', e => {
  if (!propCard.hidden && !propCard.contains(e.target) && !e.target.closest('.marker'))
    { selectedId = null; closePropCard(); renderAll(); }
});

/* ---------- 工具坞 ---------- */
document.querySelectorAll('.dock .tool').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
function setTool(t){
  tool = t;
  document.querySelectorAll('.dock .tool').forEach(b =>
    b.classList.toggle('active', b.dataset.tool === t));
  $('ringPicker').hidden = t !== 'town';
  $('sbTool').textContent = {select:'选择',town:'城镇',flag:'旗帜',mine:'联盟矿',erase:'擦除'}[t];
  board.style.cursor = t === 'erase' ? 'crosshair' : t === 'select' ? 'default' : 'copy';
  closePropCard(); selectedId = null; renderAll();
}
/* 环色选择器 */
function renderRingPicker(){
  $('ringPicker').innerHTML = [1,2,3,4,5].map(r =>
    '<button data-ring="' + r + '" class="' + (activeRing === r ? 'active' : '') + '" style="--ring-color:' + RING_COLOR[r] + '" title="' + r + ' 环（快捷键 ' + r + '）">' + r + '</button>').join('');
  $('ringPicker').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    activeRing = Number(b.dataset.ring); renderRingPicker();
  }));
}
renderRingPicker();

/* ---------- 视图开关 / 缩放 ---------- */
$('tgTowns').addEventListener('click', () => {
  showTowns = !showTowns; $('tgTowns').classList.toggle('on', showTowns); renderAll();
});
$('tgCoverage').addEventListener('click', () => {
  showCoverage = !showCoverage; $('tgCoverage').classList.toggle('on', showCoverage); renderAll();
});
$('tgTilt').addEventListener('click', () => {
  tilted = !tilted; $('tgTilt').classList.toggle('on', tilted);
  stage.classList.toggle('tilted', tilted);
  $('tgTilt').textContent = tilted ? '垂直视角' : '游戏内视角';
  renderAll();
});
/* ---------- 棋盘自适应：按「实测剩余空间」定尺寸 ----------
   以前的 min(84vh,90%) 按整个视口算，不知道顶栏/底部工具坞占了多少，
   结果每次都溢出一截、必须手动缩小。这里直接量 viewport 的内容盒。 */
let fitBase = 840;                                   /* 无缩放时的棋盘边长(px) */
function fitStage(){
  syncHudVar();
  const cs = getComputedStyle(viewport);
  /* 注意：面板显隐会改变 viewport 宽度，所以决策后必须重测一遍，
     否则跨过阈值缩放窗口时会拿旧布局算出错误的棋盘尺寸 */
  const measure = () => ({
    w: viewport.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight),
    h: viewport.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom),
  });
  let d = measure();
  const wantPanel = d.w - d.h >= 340;                /* 横向富余够大才展开信息栏 */
  if (sideInfo.classList.contains('show') !== wantPanel){
    sideInfo.classList.toggle('show', wantPanel);
    d = measure();                                   /* 布局已变，重测 */
  }
  /* 视图开关：宽屏进右侧面板；其余尺寸进底部 HUD 首行 —— 任何时候都不压棋盘。
     注意：hudViews 里即使搬空了也残留空白文本节点，:empty 不生效，必须显式 hidden。 */
  const holder = wantPanel ? $('siControls') : $('hudViews');
  $('hudViews').hidden = wantPanel;
  if (viewFloat.parentElement !== holder) holder.appendChild(viewFloat);
  /* 正方形棋盘取短边。只有「高度」是约束时才需要留 8px 呼吸位 ——
     那种情况下棋盘底边正好落在悬浮 HUD 上；宽度受限时下方本有富余，不必缩。 */
  const short = Math.min(d.w, d.h);
  fitBase = Math.max(220, short - (d.h <= d.w ? 8 : 0));
  applyStageSize();
}
function applyStageSize(){
  stage.style.width = Math.round(fitBase * zoom) + 'px';
  syncBoardFont();
}
function setZoom(z){
  zoom = Math.max(.6, Math.min(1.8, Math.round(z * 10) / 10));
  applyStageSize();
  $('zoomReset').textContent = Math.round(zoom * 100) + '%';
  renderAll();
}
$('zoomIn').addEventListener('click', () => setZoom(zoom + .1));
$('zoomOut').addEventListener('click', () => setZoom(zoom - .1));
$('zoomReset').addEventListener('click', () => setZoom(1));
viewport.addEventListener('wheel', e => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  setZoom(zoom + (e.deltaY < 0 ? .1 : -.1));
}, { passive:false });

/* ---------- 平移 ----------
   直觉操作：在空白处按住拖动就是平移（任何工具），不依赖空格；
   空格 / 中键保留（空格按住时从对象上起手也能平移）。
   不用 setPointerCapture —— capture 会把 click 的目标改掉，
   让"平移后松手"被误判成一次点击去放置对象。 */
let spaceDown = false;
let lastPanEnd = -1e9;
function justPanned(){ return performance.now() - lastPanEnd < 150; }
viewport.addEventListener('pointerdown', e => {
  const isMid = e.button === 1;
  const spaceHeld = spaceDown && e.button === 0;
  const blankLeft = e.button === 0 && !e.target.closest('.marker');
  if (!isMid && !spaceHeld && !blankLeft) return;
  panState = {
    id:e.pointerId, x:e.clientX, y:e.clientY,
    sl:viewport.scrollLeft, st:viewport.scrollTop, moved:false,
  };
});
window.addEventListener('pointermove', e => {
  if (!panState || e.pointerId !== panState.id) return;
  if (!panState.moved && Math.hypot(e.clientX - panState.x, e.clientY - panState.y) < 5) return;
  panState.moved = true;
  viewport.scrollLeft = panState.sl - (e.clientX - panState.x);
  viewport.scrollTop = panState.st - (e.clientY - panState.y);
});
['pointerup','pointercancel'].forEach(ev => window.addEventListener(ev, e => {
  if (!panState || e.pointerId !== panState.id) return;
  if (panState.moved) lastPanEnd = performance.now();
  panState = null;
}));

/* ---------- 键盘 ---------- */
window.addEventListener('keydown', e => {
  const t = e.target, typing = t.tagName === 'INPUT' || t.tagName === 'TEXTAREA';
  if (e.key === 'Escape'){
    if (typing) return;
    setTool('select'); selectedId = null; closePropCard(); renderAll(); return;
  }
  if (e.key === ' ' && !typing){ e.preventDefault(); spaceDown = true; viewport.classList.add('pan'); return; }
  if (typing) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && (e.key === 'z' || e.key === 'Z')){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && (e.key === 'y' || e.key === 'Y')){ e.preventDefault(); redo(); return; }
  if (mod || e.altKey) return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedId){
    e.preventDefault();
    commit(markers.filter(o => o.id !== selectedId));
    selectedId = null; closePropCard(); return;
  }
  if (e.key >= '1' && e.key <= '5'){ activeRing = Number(e.key); renderRingPicker(); return; }
  const map = { v:'select', t:'town', f:'flag', m:'mine', e:'erase' };
  if (map[e.key.toLowerCase()]) setTool(map[e.key.toLowerCase()]);
});

/* 导入数据的清洗：只接受合法项，熊坑强制回中心 */
function normalizeData(list){
  const out = [], counters = {};
  let hasBear = false;
  for (const r of (list || [])){
    if (!r || typeof r !== 'object' || !FOOT[r.type]) continue;
    if (r.type === 'bear'){
      if (hasBear) continue;
      hasBear = true;
      out.push({ id:'m'+(nextId++), type:'bear', x:11, y:11, name:String(r.name || '熊坑').slice(0,18) });
      continue;
    }
    const x = Math.round(Number(r.x)), y = Math.round(Number(r.y));
    if (!isFinite(x) || !isFinite(y)) continue;
    const p = snap(r.type, x, y);
    counters[r.type] = (counters[r.type] || 0) + 1;
    out.push({
      id:'m'+(nextId++), type:r.type, x:p.x, y:p.y,
      name:String(r.name || TYPE_LABEL[r.type] + ' ' + String(counters[r.type]).padStart(2,'0')).slice(0,18),
      ...(r.type === 'town' ? { ring:(r.ring >= 1 && r.ring <= 5) ? r.ring : 1 } : {}),
    });
  }
  if (!hasBear) out.push({ id:'m'+(nextId++), type:'bear', x:11, y:11, name:'熊坑' });
  return out;
}

/* ---------- PNG tEXt 隐藏数据 ---------- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c;
  }
  return t;
})();
function crc32(bytes){
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}
function pngInsertText(bytes, keyword, text){
  const enc = new TextEncoder();
  const data = enc.encode(keyword + '\0' + text);
  const chunk = new Uint8Array(12 + data.length);
  const dv = new DataView(chunk.buffer);
  dv.setUint32(0, data.length);
  chunk.set(enc.encode('tEXt'), 4);
  chunk.set(data, 8);
  dv.setUint32(8 + data.length, crc32(chunk.subarray(4, 8 + data.length)));
  const IHDR_END = 33;   /* 8 签名 + 4 长度 + 4 类型 + 13 数据 + 4 CRC */
  const out = new Uint8Array(bytes.length + chunk.length);
  out.set(bytes.subarray(0, IHDR_END), 0);
  out.set(chunk, IHDR_END);
  out.set(bytes.subarray(IHDR_END), IHDR_END + chunk.length);
  return out;
}
function pngExtractText(bytes, keyword){
  const dec = new TextDecoder();
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let pos = 8;
  while (pos + 12 <= bytes.length){
    const len = dv.getUint32(pos);
    const type = dec.decode(bytes.subarray(pos + 4, pos + 8));
    if (type === 'tEXt'){
      const data = bytes.subarray(pos + 8, pos + 8 + len);
      const nul = data.indexOf(0);
      if (dec.decode(data.subarray(0, nul)) === keyword)
        return dec.decode(data.subarray(nul + 1));
    }
    if (type === 'IEND') break;
    pos += 12 + len;
  }
  return null;
}

/* ---------- 生成图片（canvas 绘制，垂直视角） ---------- */
function themeTok(name, fallback){
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fallback;
}
function rrect(ctx, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function generateImage(){
  const SIZE = 1000, M = 46, CELL = (SIZE - M * 2) / GRID;
  const cv = document.createElement('canvas');
  cv.width = SIZE; cv.height = SIZE;
  const ctx = cv.getContext('2d');
  const ink = themeTok('--ink', '#152230'), faint = themeTok('--faint', '#66737f');
  const boardBg = themeTok('--board', '#e8edf3');
  const major = themeTok('--grid-major', 'rgba(29,44,58,.5)');
  const minor = themeTok('--grid-minor', 'rgba(42,59,76,.2)');
  const accent = themeTok('--accent', '#c2410c');
  const okC = themeTok('--ok', '#0f6b4a');
  ctx.fillStyle = themeTok('--bg', '#eef1f5');
  ctx.fillRect(0, 0, SIZE, SIZE);
  /* 棋盘底 + 网格 */
  ctx.fillStyle = boardBg;
  ctx.fillRect(M, M, SIZE - M * 2, SIZE - M * 2);
  ctx.lineWidth = 1;
  for (let i = 0; i <= GRID; i++){
    const p = M + i * CELL;
    ctx.strokeStyle = minor;
    ctx.beginPath(); ctx.moveTo(p, M); ctx.lineTo(p, SIZE - M); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(M, p); ctx.lineTo(SIZE - M, p); ctx.stroke();
    if (i % 5 === 0 && i < GRID){
      ctx.strokeStyle = major;
      ctx.beginPath(); ctx.moveTo(p + .5, M); ctx.lineTo(p + .5, SIZE - M); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(M, p + .5); ctx.lineTo(SIZE - M, p + .5); ctx.stroke();
    }
  }
  ctx.strokeStyle = themeTok('--line', '#a8b4c0');
  ctx.lineWidth = 2;
  ctx.strokeRect(M, M, SIZE - M * 2, SIZE - M * 2);
  /* 覆盖范围 */
  if (showCoverage){
    ctx.setLineDash([7, 5]);
    for (const m of markers){
      if (m.type !== 'flag') continue;
      ctx.fillStyle = okC + '1f';
      ctx.strokeStyle = okC + '99';
      ctx.fillRect(M + (m.x - FLAG_RANGE) * CELL, M + (m.y - FLAG_RANGE) * CELL, (FLAG_RANGE*2+1) * CELL, (FLAG_RANGE*2+1) * CELL);
      ctx.strokeRect(M + (m.x - FLAG_RANGE) * CELL, M + (m.y - FLAG_RANGE) * CELL, (FLAG_RANGE*2+1) * CELL, (FLAG_RANGE*2+1) * CELL);
    }
    ctx.setLineDash([]);
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const font = px => '700 ' + px + 'px "PingFang SC","Microsoft YaHei",sans-serif';
  /* 熊坑 */
  for (const m of markers){
    if (m.type !== 'bear') continue;
    const f = FOOT.bear;
    const x = M + m.x * CELL, y = M + m.y * CELL, w = f.w * CELL, h = f.h * CELL;
    ctx.fillStyle = themeTok('--accent-soft', '#fcebe1');
    rrect(ctx, x + 2, y + 2, w - 4, h - 4, 8); ctx.fill();
    ctx.strokeStyle = accent; ctx.lineWidth = 2.5;
    rrect(ctx, x + 2, y + 2, w - 4, h - 4, 8); ctx.stroke();
    ctx.fillStyle = themeTok('--accent-ink', '#9d3609');
    ctx.font = font(Math.max(13, CELL * .4));
    ctx.fillText('◎ ' + m.name, x + w / 2, y + h / 2, w - 10);
  }
  /* 城镇 */
  for (const m of markers){
    if (m.type !== 'town') continue;
    const x = M + m.x * CELL, y = M + m.y * CELL, w = FOOT.town.w * CELL, h = FOOT.town.h * CELL;
    ctx.fillStyle = RING_COLOR[m.ring || 1];
    rrect(ctx, x + 1, y + 1, w - 2, h - 2, 5); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x + w / 2, y + 2); ctx.lineTo(x + w / 2, y + h - 2);
    ctx.moveTo(x + 2, y + h / 2); ctx.lineTo(x + w - 2, y + h / 2);
    ctx.stroke();
    ctx.fillStyle = '#101a24';
    ctx.font = font(Math.max(10, CELL * .34));
    ctx.fillText(m.name, x + w / 2, y + h / 2, w - 6);
  }
  /* 联盟矿 */
  for (const m of markers){
    if (m.type !== 'mine') continue;
    const x = M + m.x * CELL, y = M + m.y * CELL, w = FOOT.mine.w * CELL, h = FOOT.mine.h * CELL;
    ctx.fillStyle = 'rgba(122,90,16,.14)';
    rrect(ctx, x + 1, y + 1, w - 2, h - 2, 5); ctx.fill();
    ctx.strokeStyle = 'rgba(122,90,16,.6)'; ctx.lineWidth = 1.5;
    rrect(ctx, x + 1, y + 1, w - 2, h - 2, 5); ctx.stroke();
    ctx.fillStyle = themeTok('--gold', '#7a5a10');
    ctx.font = font(Math.max(13, CELL * .42));
    ctx.fillText('⛏', x + w / 2, y + h / 2);
  }
  /* 旗帜 */
  for (const m of markers){
    if (m.type !== 'flag') continue;
    const x = M + m.x * CELL, y = M + m.y * CELL;
    ctx.fillStyle = '#ffffff';
    rrect(ctx, x + CELL * .18, y + CELL * .18, CELL * .64, CELL * .64, 4); ctx.fill();
    ctx.strokeStyle = okC; ctx.lineWidth = 1.5;
    rrect(ctx, x + CELL * .18, y + CELL * .18, CELL * .64, CELL * .64, 4); ctx.stroke();
    const px = x + CELL * .38, py = y + CELL * .30, ph = CELL * .44;
    ctx.strokeStyle = okC; ctx.lineWidth = Math.max(1.5, CELL * .05);
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py + ph); ctx.stroke();
    ctx.fillStyle = okC;
    ctx.beginPath();
    ctx.moveTo(px, py); ctx.lineTo(px + CELL * .3, py + ph * .28); ctx.lineTo(px, py + ph * .56);
    ctx.closePath(); ctx.fill();
  }
  /* 坐标轴 */
  ctx.fillStyle = faint;
  ctx.font = '500 12px ui-monospace,Menlo,Consolas,monospace';
  for (let i = 0; i < GRID; i++){
    if (i === 0 || (i + 1) % 5 === 0){
      ctx.fillText(String(i + 1), M + i * CELL + CELL / 2, M - 14);
      ctx.fillText(String(i + 1), M - 16, M + i * CELL + CELL / 2);
    }
  }
  /* 水印 */
  ctx.fillStyle = faint;
  ctx.font = '600 13px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('熊坑地图 · WJDR 联盟工具', M, SIZE - 18);
  ctx.textAlign = 'right';
  ctx.fillText(new Date().toLocaleDateString('zh-CN'), SIZE - M, SIZE - 18);
  /* 输出 PNG 并写入隐藏数据 */
  cv.toBlob(async blob => {
    const buf = new Uint8Array(await blob.arrayBuffer());
    const out = pngInsertText(buf, 'wjdr-map', mapDataJson());
    const url = URL.createObjectURL(new Blob([out], { type:'image/png' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'bear-map-' + new Date().toISOString().slice(0, 10) + '.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    notify('图片已生成（内嵌完整地图数据）');
  }, 'image/png');
}
$('imgFile').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  file.arrayBuffer().then(buf => {
    const json = pngExtractText(new Uint8Array(buf), 'wjdr-map');
    if (!json){ notify('读不出隐藏数据：请使用本站生成的原始 PNG（微信/QQ 传输或压缩会丢失）'); return; }
    try{
      const d = JSON.parse(json);
      commit(normalizeData(d.markers || []));
      if (d.world && isFinite(d.world.x)){ worldX = d.world.x; worldY = d.world.y;
        localStorage.setItem('wjdr-redesign-world', JSON.stringify(d.world)); }
      notify('已从图片恢复 ' + markers.length + ' 个对象');
    }catch(err){ notify('图片内嵌数据损坏'); }
  });
});

/* ---------- 启动 ---------- */
window.__dbg = () => ({ tool, drag: !!dragState, moved: dragActive,
  hist: history.length, fut: future.length, n: markers.length });
/* 测试辅助：返回一个「当前视口内可见」的空白 1×1 格及其屏幕坐标 */
window.__blankCellVisible = () => {
  const F = { flag:[1,1], town:[2,2], mine:[2,2], bear:[3,3] };
  const occ = new Set();
  for (const m of markers)
    for (let dx = 0; dx < F[m.type][0]; dx++)
      for (let dy = 0; dy < F[m.type][1]; dy++) occ.add((m.x+dx) + ',' + (m.y+dy));
  const r = board.getBoundingClientRect();
  for (let y = 2; y < GRID - 2; y++)
    for (let x = 2; x < GRID - 2; x++){
      if (occ.has(x + ',' + y)) continue;
      const sx = r.left + (x + .5) / GRID * r.width;
      const sy = r.top + (y + .5) / GRID * r.height;
      if (sx > 60 && sx < innerWidth - 60 && sy > 90 && sy < innerHeight - 170)
        return { x, y, sx: Math.round(sx), sy: Math.round(sy) };
    }
  return null;
};
renderAxes();
syncOrigin();
if (!load()){
  markers = normalizeData(ORIGINAL_TEMPLATE.markers);
  worldX = ORIGINAL_TEMPLATE.worldX;
  worldY = ORIGINAL_TEMPLATE.worldY;
}
fitStage();
/* 界面大小：默认「较小」(.9)，记住用户的选择 */
try{
  const savedZ = parseFloat(localStorage.getItem(UI_ZOOM_KEY));
  setUiZoom(savedZ >= .8 && savedZ <= 1.15 ? savedZ : .9, false);
}catch(e){ setUiZoom(.9, false); }
renderAll();
</script>
